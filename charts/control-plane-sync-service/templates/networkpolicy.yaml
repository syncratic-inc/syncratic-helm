{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "control-plane-sync-service.fullname" . }}
  labels:
    {{- include "control-plane-sync-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "control-plane-sync-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.allowIngressNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowIngressNamespaceLabels | nindent 14 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  {{- if .Values.networkPolicy.allowAllEgress }}
  egress:
    - {}
  {{- end }}
{{- end }}
