{{- if .Values.bgeEmbeddings.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-bge-embeddings
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.bgeEmbeddings.service.type }}
  selector:
    {{- include "syncratic-phase1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bge-embeddings
  ports:
    - name: http
      port: {{ .Values.bgeEmbeddings.service.port }}
      targetPort: http
{{- end }}
