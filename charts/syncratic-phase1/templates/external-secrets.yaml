{{- if and (eq .Values.materialPolicy.sourceMode "cluster_managed") (eq .Values.materialPolicy.manager "external_secrets") .Values.materialPolicy.externalSecrets.enabled }}
{{- $documents := list -}}
{{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.bootstrapSecretName" .) "keys" .Values.materialTests.bootstrapRequiredSecretKeys)) -}}
{{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.authRuntimeSecretName" .) "keys" .Values.materialTests.authRequiredSecretKeys)) -}}
{{- if .Values.auth.identityProvisioning.enabled -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.identityProvisioningSecretName" .) "keys" .Values.materialTests.identityProvisioningRequiredSecretKeys)) -}}
{{- end -}}
{{- if .Values.licensing.publicKeys.existingSecret -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.licensingPublicKeysSecretName" .) "keys" (list .Values.licensing.publicKeys.key))) -}}
{{- end -}}
{{- if .Values.help.enabled -}}
  {{- $helpKeys := .Values.materialTests.helpRequiredSecretKeys -}}
  {{- if .Values.help.curator.enabled -}}
    {{- $helpKeys = concat $helpKeys .Values.materialTests.helpCuratorRequiredSecretKeys -}}
  {{- end -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.helpGatewayTokenSecretName" .) "keys" $helpKeys)) -}}
{{- end -}}
{{- if and .Values.registration.enabled .Values.registration.publicKeys.existingSecret -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.registrationPublicKeysSecretName" .) "keys" (list .Values.registration.publicKeys.key))) -}}
{{- end -}}
{{- if and .Values.registration.enabled (.Values.registration.adminTokenSecret.existingSecret | trim) -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.registrationAdminTokenSecretName" .) "keys" (list .Values.registration.adminTokenSecret.keys.adminToken))) -}}
{{- end -}}
{{- if and .Values.registration.enabled (.Values.registration.les.mtls.caSecret.existingSecret | trim) -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.registrationLesMtlsCaSecretName" .) "keys" (list .Values.registration.les.mtls.caSecret.keys.cert .Values.registration.les.mtls.caSecret.keys.key))) -}}
{{- end -}}
{{- if and .Values.registration.enabled (.Values.registration.les.initialLicenseSecret.existingSecret | trim) -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.registrationLesInitialLicenseSecretName" .) "keys" (list .Values.registration.les.initialLicenseSecret.keys.licenseJson))) -}}
{{- end -}}
{{- if .Values.evaluation.enabled -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.evaluationRuntimeSecretName" .) "keys" .Values.materialTests.evaluationRequiredSecretKeys)) -}}
{{- end -}}
{{- if .Values.orchestrator.enabled -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.orchestratorRuntimeSecretName" .) "keys" .Values.materialTests.orchestratorRequiredSecretKeys)) -}}
{{- end -}}
{{- if .Values.postgres.enabled -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.postgresAuthSecretName" .) "keys" .Values.materialTests.postgresRequiredSecretKeys)) -}}
{{- end -}}
{{- if .Values.keycloak.enabled -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.keycloakAdminSecretName" .) "keys" .Values.materialTests.keycloakAdminRequiredSecretKeys)) -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.keycloakDbSecretName" .) "keys" .Values.materialTests.keycloakDbRequiredSecretKeys)) -}}
  {{- if .Values.keycloak.realm.existingSecret -}}
    {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.keycloakRealmSecretName" .) "keys" (list .Values.keycloak.realm.key))) -}}
  {{- end -}}
{{- end -}}
{{- if .Values.observability.enabled -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.observabilityGrafanaAdminSecretName" .) "keys" .Values.materialTests.observabilityGrafanaAdminRequiredSecretKeys)) -}}
{{- end -}}
{{- if eq .Values.licensing.controlPlane.mode "connected" -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.licensingControlPlaneTokenSecretName" .) "keys" (list .Values.licensing.controlPlane.tokenSecret.key))) -}}
  {{- if .Values.licensing.controlPlane.tls.caSecret -}}
    {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.licensingControlPlaneTlsCaSecretName" .) "keys" (list .Values.licensing.controlPlane.tls.caKey))) -}}
  {{- end -}}
  {{- if .Values.licensing.controlPlane.tls.clientSecret -}}
    {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.licensingControlPlaneTlsClientSecretName" .) "keys" (list .Values.licensing.controlPlane.tls.clientCertKey .Values.licensing.controlPlane.tls.clientKeyKey))) -}}
  {{- end -}}
{{- end -}}
{{- if .Values.externalServices.trustBundle.existingSecret -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.externalTrustBundleSecretName" .) "keys" (list .Values.externalServices.trustBundle.key))) -}}
{{- end -}}
{{- if .Values.externalServices.connectionSecret.existingSecret -}}
  {{- $documents = append $documents (include "syncratic-phase1.renderExternalSecret" (dict "root" . "secretName" (include "syncratic-phase1.externalConnectionSecretName" .) "keys" (list
      .Values.externalServices.connectionSecret.keys.postgresUrl
      .Values.externalServices.connectionSecret.keys.gatewayMigrationDsn
      .Values.externalServices.connectionSecret.keys.redisUrl
      .Values.externalServices.connectionSecret.keys.qdrantUrl
      .Values.externalServices.connectionSecret.keys.neo4jUri
      .Values.externalServices.connectionSecret.keys.neo4jUsername
      .Values.externalServices.connectionSecret.keys.neo4jPassword
      .Values.externalServices.connectionSecret.keys.keycloakInternalUrl
      .Values.externalServices.connectionSecret.keys.bgeEmbeddingsUrl
      .Values.externalServices.connectionSecret.keys.llmFastUrl
      .Values.externalServices.connectionSecret.keys.llmDeepUrl
      .Values.externalServices.connectionSecret.keys.transformerUrl
    ))) -}}
{{- end -}}
{{ join "\n---\n" $documents }}
{{- end }}
