{{- if and .Values.licensing.enabled .Values.licensing.renewal.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-licensing-renewal
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.licensing.renewal.schedule | quote }}
  suspend: {{ .Values.licensing.renewal.suspend }}
  concurrencyPolicy: {{ .Values.licensing.renewal.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.licensing.renewal.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.licensing.renewal.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.licensing.renewal.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "syncratic-phase1.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: licensing-renewal
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "syncratic-phase1.licensingRenewalServiceAccountName" . }}
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: licensing-renewal
              image: "{{ include "syncratic-phase1.imageRef" (dict "Values" .Values "image" (dict "repository" (default .Values.registration.image.repository .Values.licensing.renewal.image.repository) "tag" (default .Values.registration.image.tag .Values.licensing.renewal.image.tag) "pullPolicy" (default .Values.registration.image.pullPolicy .Values.licensing.renewal.image.pullPolicy))) }}"
              imagePullPolicy: {{ default .Values.registration.image.pullPolicy .Values.licensing.renewal.image.pullPolicy }}
              command:
                - python
                - -m
                - app.run_k8s_les_practical_renewal_policy
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: REGISTRATION_SERVICE_URL
                  value: {{ printf "http://%s-registration:%v" (include "syncratic-phase1.fullname" .) .Values.registration.service.port | quote }}
                - name: SYNCRATIC_LES_TLS_SECRET_NAME
                  value: {{ include "syncratic-phase1.licensingControlPlaneTlsClientSecretName" . | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_NAME
                  value: {{ include "syncratic-phase1.licensingRenewalRuntimeOutputSecretName" . | quote }}
                - name: SYNCRATIC_LES_RENEWAL_SOURCE_DIR
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.mountPath | quote }}
                - name: REGISTRATION_OUTPUT_DIR
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.workingDir | quote }}
                - name: SYNCRATIC_LES_RENEWAL_SUMMARY_DIR
                  value: {{ .Values.licensing.renewal.summaryDir | quote }}
                - name: SYNCRATIC_LES_RENEWAL_DUE_WITHIN_DAYS
                  value: {{ .Values.licensing.renewal.dueWithinDays | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_KEY_CONTROL_PLANE_JSON
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.controlPlaneJson | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_KEY_ENROLLMENT_RECEIPT_JSON
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.enrollmentReceiptJson | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_KEY_MACHINE_PRIVATE_KEY_PEM
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.machinePrivateKeyPem | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_KEY_MTLS_STATE_JSON
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.mtlsStateJson | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_KEY_CLIENT_CERT_PEM
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.clientCertPem | quote }}
                - name: SYNCRATIC_LES_RUNTIME_OUTPUT_SECRET_KEY_CLIENT_KEY_PEM
                  value: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.clientKeyPem | quote }}
              volumeMounts:
                - name: runtime-output-source
                  mountPath: {{ .Values.licensing.renewal.runtimeOutputSecret.mountPath }}
                  readOnly: true
              resources:
                {{- toYaml .Values.registration.resources | nindent 16 }}
          volumes:
            - name: runtime-output-source
              secret:
                secretName: {{ include "syncratic-phase1.licensingRenewalRuntimeOutputSecretName" . }}
                items:
                  - key: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.controlPlaneJson }}
                    path: les-control-plane.json
                  - key: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.enrollmentReceiptJson }}
                    path: les-enrollment-receipt.json
                  - key: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.machinePrivateKeyPem }}
                    path: les-machine-identity-private-key.pem
                  - key: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.mtlsStateJson }}
                    path: les-mtls-state.json
                  - key: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.clientCertPem }}
                    path: les-control-plane-client.crt
                  - key: {{ .Values.licensing.renewal.runtimeOutputSecret.keys.clientKeyPem }}
                    path: les-control-plane-client.key
{{- end }}
