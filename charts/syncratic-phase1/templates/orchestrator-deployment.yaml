{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-orchestrator
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "syncratic-phase1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "syncratic-phase1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
      {{- with .Values.orchestrator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: "{{ include "syncratic-phase1.imageRef" (dict "Values" .Values "image" .Values.orchestrator.image) }}"
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.service.port }}
          env:
            - name: N8N_HOST
              value: {{ .Values.ingress.frontendHost | default "localhost" | quote }}
            - name: N8N_PROTOCOL
              value: {{ .Values.ingress.publicScheme | quote }}
            - name: N8N_PORT
              value: {{ .Values.orchestrator.service.port | quote }}
            - name: N8N_PATH
              value: {{ .Values.orchestrator.path | quote }}
            - name: N8N_EDITOR_BASE_URL
              value: {{ printf "%s%s" (include "syncratic-phase1.publicAppUrl" .) .Values.orchestrator.path | quote }}
            - name: WEBHOOK_URL
              value: {{ printf "%s%s" (include "syncratic-phase1.publicAppUrl" .) .Values.orchestrator.path | quote }}
            - name: N8N_BASIC_AUTH_ACTIVE
              value: {{ .Values.orchestrator.basicAuth.enabled | quote }}
            - name: N8N_BASIC_AUTH_USER
              value: {{ .Values.orchestrator.basicAuth.username | quote }}
            - name: N8N_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic-phase1.orchestratorRuntimeSecretName" . }}
                  key: {{ .Values.orchestrator.runtimeSecret.keys.basicAuthPassword }}
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: {{ ternary (include "syncratic-phase1.postgresHost" .) .Values.orchestrator.database.host .Values.postgres.enabled | quote }}
            - name: DB_POSTGRESDB_PORT
              value: {{ ternary (printf "%v" .Values.postgres.service.port) (printf "%v" .Values.orchestrator.database.port) .Values.postgres.enabled | quote }}
            - name: DB_POSTGRESDB_DATABASE
              value: {{ ternary .Values.postgres.contract.orchestratorDatabase (default .Values.postgres.contract.orchestratorDatabase .Values.orchestrator.database.name) .Values.postgres.enabled | quote }}
            - name: DB_POSTGRESDB_USER
              value: {{ ternary .Values.postgres.contract.orchestratorUser (default .Values.postgres.contract.orchestratorUser .Values.orchestrator.database.user) .Values.postgres.enabled | quote }}
            - name: DB_POSTGRESDB_PASSWORD
              {{- if .Values.postgres.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic-phase1.postgresAuthSecretName" . }}
                  key: {{ .Values.postgres.auth.keys.orchestratorPassword }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic-phase1.orchestratorRuntimeSecretName" . }}
                  key: {{ .Values.orchestrator.runtimeSecret.keys.dbPassword }}
              {{- end }}
            - name: TZ
              value: {{ .Values.orchestrator.timezone | quote }}
            {{- include "syncratic-phase1.renderMapEnv" (dict "root" . "values" .Values.orchestrator.extraEnv) | nindent 12 }}
          volumeMounts:
            - name: orchestrator-data
              mountPath: /home/node/.n8n
          startupProbe:
            {{- toYaml .Values.orchestrator.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.orchestrator.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.orchestrator.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: orchestrator-data
          persistentVolumeClaim:
            claimName: {{ default (include "syncratic-phase1.orchestratorDataPvcName" .) .Values.orchestrator.persistence.existingClaim }}
{{- end }}
