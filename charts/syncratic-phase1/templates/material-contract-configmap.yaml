{{- if .Values.materialPolicy.publishContract }}
{{- $requiredSecrets := list -}}
{{- $requiredConfigMaps := list -}}
{{- $optionalSecrets := list -}}
{{- $optionalConfigMaps := list -}}

{{- $bootstrapProvider := ternary "chart" "cluster" (and .Values.security.bootstrapSecret.create (not .Values.security.existingSecret)) -}}
{{- $requiredSecrets = append $requiredSecrets (dict
  "name" (include "syncratic-phase1.bootstrapSecretName" .)
  "provider" $bootstrapProvider
  "purpose" "bootstrap_runtime"
  "requiredKeys" .Values.materialTests.bootstrapRequiredSecretKeys
) -}}

{{- $authProvider := "cluster" -}}
{{- if .Values.auth.runtimeSecret.existingSecret -}}
  {{- $authProvider = "cluster" -}}
{{- else if .Values.auth.runtimeSecret.create -}}
  {{- $authProvider = "chart" -}}
{{- else if and .Values.security.bootstrapSecret.create (not .Values.security.existingSecret) -}}
  {{- $authProvider = "chart" -}}
{{- end -}}
{{- $requiredSecrets = append $requiredSecrets (dict
  "name" (include "syncratic-phase1.authRuntimeSecretName" .)
  "provider" $authProvider
  "purpose" "frontend_auth_runtime"
  "requiredKeys" .Values.materialTests.authRequiredSecretKeys
) -}}

{{- if .Values.auth.identityProvisioning.enabled -}}
  {{- $identityProvisioningProvider := ternary "chart" "cluster" (and .Values.auth.identityProvisioning.secret.create (not .Values.auth.identityProvisioning.secret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.identityProvisioningSecretName" .)
    "provider" $identityProvisioningProvider
    "purpose" "identity_provisioning_keycloak_admin_client"
    "requiredKeys" .Values.materialTests.identityProvisioningRequiredSecretKeys
  ) -}}
{{- end -}}

{{- if .Values.auth.bootstrapSmtp.enabled -}}
  {{- $bootstrapSmtpProvider := ternary "chart" "cluster" (and .Values.auth.bootstrapSmtp.passwordSecret.create (not .Values.auth.bootstrapSmtp.passwordSecret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.bootstrapSmtpSecretName" .)
    "provider" $bootstrapSmtpProvider
    "purpose" "bootstrap_smtp_password"
    "requiredKeys" .Values.materialTests.bootstrapSmtpRequiredSecretKeys
  ) -}}
{{- end -}}

{{- if .Values.gateway.enabled -}}
  {{- if or .Values.gateway.initialOperatorBootstrapSecret.existingSecret .Values.gateway.initialOperatorBootstrapSecret.create -}}
    {{- $gatewayInitialOperatorProvider := ternary "chart" "cluster" (and .Values.gateway.initialOperatorBootstrapSecret.create (not .Values.gateway.initialOperatorBootstrapSecret.existingSecret)) -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.gatewayInitialOperatorBootstrapSecretName" .)
      "provider" $gatewayInitialOperatorProvider
      "purpose" "gateway_initial_operator_bootstrap"
      "requiredKeys" (list .Values.gateway.initialOperatorBootstrapSecret.keys.bootstrapArtifact)
    ) -}}
  {{- end -}}
{{- end -}}

{{- if .Values.licensing.publicKeys.existingSecret -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.licensingPublicKeysSecretName" .)
    "provider" "cluster"
    "purpose" "les_public_keyring"
    "requiredKeys" (list .Values.licensing.publicKeys.key)
  ) -}}
{{- else -}}
  {{- $licensingPublicKeysProvider := ternary "chart" "cluster" (and .Values.licensing.publicKeys.create (not .Values.licensing.publicKeys.existingConfigMap)) -}}
  {{- $requiredConfigMaps = append $requiredConfigMaps (dict
    "name" (include "syncratic-phase1.licensingPublicKeysConfigMapName" .)
    "provider" $licensingPublicKeysProvider
    "purpose" "les_public_keyring"
    "requiredKeys" (list .Values.licensing.publicKeys.key)
  ) -}}
{{- end -}}

{{- if .Values.help.enabled -}}
  {{- $helpProvider := ternary "chart" "cluster" (and .Values.help.gatewayTokenSecret.create (not .Values.help.gatewayTokenSecret.existingSecret)) -}}
  {{- $helpKeys := .Values.materialTests.helpRequiredSecretKeys -}}
  {{- if .Values.help.curator.enabled -}}
    {{- $helpKeys = concat $helpKeys .Values.materialTests.helpCuratorRequiredSecretKeys -}}
  {{- end -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.helpGatewayTokenSecretName" .)
    "provider" $helpProvider
    "purpose" "help_gateway_tokens"
    "requiredKeys" $helpKeys
  ) -}}
{{- end -}}

{{- if and .Values.licensing.enabled .Values.licensing.renewal.enabled -}}
  {{- $licensingRenewalProvider := ternary "chart" "cluster" (and .Values.licensing.renewal.runtimeOutputSecret.create (not .Values.licensing.renewal.runtimeOutputSecret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.licensingRenewalRuntimeOutputSecretName" .)
    "provider" $licensingRenewalProvider
    "purpose" "les_renewal_runtime_output"
    "requiredKeys" (list
      .Values.licensing.renewal.runtimeOutputSecret.keys.controlPlaneJson
      .Values.licensing.renewal.runtimeOutputSecret.keys.enrollmentReceiptJson
      .Values.licensing.renewal.runtimeOutputSecret.keys.machinePrivateKeyPem
      .Values.licensing.renewal.runtimeOutputSecret.keys.mtlsStateJson
      .Values.licensing.renewal.runtimeOutputSecret.keys.clientCertPem
      .Values.licensing.renewal.runtimeOutputSecret.keys.clientKeyPem
    )
  ) -}}
{{- end -}}

{{- if .Values.registration.enabled -}}
  {{- if .Values.registration.publicKeys.existingSecret -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.registrationPublicKeysSecretName" .)
      "provider" "cluster"
      "purpose" "registration_public_keyring"
      "requiredKeys" (list .Values.registration.publicKeys.key)
    ) -}}
  {{- else -}}
    {{- $registrationPublicKeysProvider := ternary "chart" "cluster" (and .Values.registration.publicKeys.create (not .Values.registration.publicKeys.existingConfigMap)) -}}
    {{- $requiredConfigMaps = append $requiredConfigMaps (dict
      "name" (include "syncratic-phase1.registrationPublicKeysConfigMapName" .)
      "provider" $registrationPublicKeysProvider
      "purpose" "registration_public_keyring"
      "requiredKeys" (list .Values.registration.publicKeys.key)
    ) -}}
  {{- end -}}
  {{- if or .Values.registration.adminTokenSecret.existingSecret .Values.registration.adminTokenSecret.create -}}
    {{- $registrationAdminProvider := ternary "chart" "cluster" (and .Values.registration.adminTokenSecret.create (not .Values.registration.adminTokenSecret.existingSecret)) -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.registrationAdminTokenSecretName" .)
      "provider" $registrationAdminProvider
      "purpose" "registration_admin_token"
      "requiredKeys" (list .Values.registration.adminTokenSecret.keys.adminToken)
    ) -}}
  {{- end -}}
  {{- if or .Values.registration.bootstrapAuthority.existingSecret .Values.registration.bootstrapAuthority.create -}}
    {{- $registrationBootstrapAuthorityProvider := ternary "chart" "cluster" (and .Values.registration.bootstrapAuthority.create (not .Values.registration.bootstrapAuthority.existingSecret)) -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.registrationBootstrapAuthoritySecretName" .)
      "provider" $registrationBootstrapAuthorityProvider
      "purpose" "registration_bootstrap_authority"
      "requiredKeys" (list .Values.registration.bootstrapAuthority.keys.privateKey)
    ) -}}
  {{- end -}}
  {{- if eq (.Values.registration.les.steadyStateAuthMode | lower) "mtls" -}}
    {{- $registrationLesMtlsProvider := ternary "chart" "cluster" (and .Values.registration.les.mtls.caSecret.create (not .Values.registration.les.mtls.caSecret.existingSecret)) -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.registrationLesMtlsCaSecretName" .)
      "provider" $registrationLesMtlsProvider
      "purpose" "registration_les_mtls_ca"
      "requiredKeys" (list .Values.registration.les.mtls.caSecret.keys.cert .Values.registration.les.mtls.caSecret.keys.key)
    ) -}}
  {{- end -}}
  {{- if eq (.Values.registration.les.licenseHandoffMode | lower) "embedded_signed_license" -}}
    {{- $registrationLesLicenseProvider := ternary "chart" "cluster" (and .Values.registration.les.initialLicenseSecret.create (not .Values.registration.les.initialLicenseSecret.existingSecret)) -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.registrationLesInitialLicenseSecretName" .)
      "provider" $registrationLesLicenseProvider
      "purpose" "registration_les_initial_license"
      "requiredKeys" (list .Values.registration.les.initialLicenseSecret.keys.licenseJson)
    ) -}}
  {{- end -}}
{{- end -}}

{{- if .Values.evaluation.enabled -}}
  {{- $evaluationProvider := ternary "chart" "cluster" (and .Values.evaluation.runtimeSecret.create (not .Values.evaluation.runtimeSecret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.evaluationRuntimeSecretName" .)
    "provider" $evaluationProvider
    "purpose" "evaluation_runtime"
    "requiredKeys" .Values.materialTests.evaluationRequiredSecretKeys
  ) -}}
{{- end -}}

{{- if .Values.orchestrator.enabled -}}
  {{- $orchestratorProvider := ternary "chart" "cluster" (and .Values.orchestrator.runtimeSecret.create (not .Values.orchestrator.runtimeSecret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.orchestratorRuntimeSecretName" .)
    "provider" $orchestratorProvider
    "purpose" "orchestrator_runtime"
    "requiredKeys" .Values.materialTests.orchestratorRequiredSecretKeys
  ) -}}
{{- end -}}

{{- if .Values.postgres.enabled -}}
  {{- $postgresProvider := ternary "chart" "cluster" (and .Values.postgres.auth.create (not .Values.postgres.auth.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.postgresAuthSecretName" .)
    "provider" $postgresProvider
    "purpose" "postgres_auth"
    "requiredKeys" .Values.materialTests.postgresRequiredSecretKeys
  ) -}}
{{- end -}}

{{- if .Values.keycloak.enabled -}}
  {{- $keycloakAdminProvider := ternary "chart" "cluster" (and .Values.keycloak.adminSecret.create (not .Values.keycloak.adminSecret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.keycloakAdminSecretName" .)
    "provider" $keycloakAdminProvider
    "purpose" "keycloak_admin"
    "requiredKeys" .Values.materialTests.keycloakAdminRequiredSecretKeys
  ) -}}
  {{- $keycloakDbProvider := ternary "chart" "cluster" (and .Values.keycloak.database.create (not .Values.keycloak.database.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.keycloakDbSecretName" .)
    "provider" $keycloakDbProvider
    "purpose" "keycloak_database"
    "requiredKeys" .Values.materialTests.keycloakDbRequiredSecretKeys
  ) -}}
  {{- if .Values.keycloak.realm.existingSecret -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.keycloakRealmSecretName" .)
      "provider" "cluster"
      "purpose" "keycloak_realm_import"
      "requiredKeys" (list .Values.keycloak.realm.key)
    ) -}}
  {{- else -}}
    {{- $keycloakRealmProvider := ternary "chart" "cluster" (and .Values.keycloak.realm.create (not .Values.keycloak.realm.existingConfigMap)) -}}
    {{- $requiredConfigMaps = append $requiredConfigMaps (dict
      "name" (include "syncratic-phase1.keycloakRealmConfigMapName" .)
      "provider" $keycloakRealmProvider
      "purpose" "keycloak_realm_import"
      "requiredKeys" (list .Values.keycloak.realm.key)
    ) -}}
  {{- end -}}
{{- end -}}

{{- if .Values.observability.enabled -}}
  {{- $observabilityAdminProvider := ternary "chart" "cluster" (and .Values.observability.grafana.adminSecret.create (not .Values.observability.grafana.adminSecret.existingSecret)) -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.observabilityGrafanaAdminSecretName" .)
    "provider" $observabilityAdminProvider
    "purpose" "observability_grafana_admin"
    "requiredKeys" .Values.materialTests.observabilityGrafanaAdminRequiredSecretKeys
  ) -}}
{{- end -}}

{{- if eq .Values.licensing.controlPlane.mode "connected" -}}
  {{- $requiredSecrets = append $requiredSecrets (dict
    "name" (include "syncratic-phase1.licensingControlPlaneTokenSecretName" .)
    "provider" "cluster"
    "purpose" "les_control_plane_token"
    "requiredKeys" (list .Values.licensing.controlPlane.tokenSecret.key)
  ) -}}
  {{- if .Values.licensing.controlPlane.tls.caSecret -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.licensingControlPlaneTlsCaSecretName" .)
      "provider" "cluster"
      "purpose" "les_control_plane_tls_ca"
      "requiredKeys" (list .Values.licensing.controlPlane.tls.caKey)
    ) -}}
  {{- else if .Values.licensing.controlPlane.tls.caConfigMap -}}
    {{- $requiredConfigMaps = append $requiredConfigMaps (dict
      "name" (include "syncratic-phase1.licensingControlPlaneTlsConfigMapName" .)
      "provider" "cluster"
      "purpose" "les_control_plane_tls_ca"
      "requiredKeys" (list .Values.licensing.controlPlane.tls.caKey)
    ) -}}
  {{- end -}}
  {{- if .Values.licensing.controlPlane.tls.clientSecret -}}
    {{- $requiredSecrets = append $requiredSecrets (dict
      "name" (include "syncratic-phase1.licensingControlPlaneTlsClientSecretName" .)
      "provider" "cluster"
      "purpose" "les_control_plane_tls_client"
      "requiredKeys" (list .Values.licensing.controlPlane.tls.clientCertKey .Values.licensing.controlPlane.tls.clientKeyKey)
    ) -}}
  {{- end -}}
{{- end -}}

{{- if or .Values.externalServices.connectionSecret.existingSecret .Values.materialPolicy.requireExternalConnectionSecret -}}
  {{- $optionalSecrets = append $optionalSecrets (dict
    "name" (include "syncratic-phase1.externalConnectionSecretName" .)
    "provider" "cluster"
    "purpose" "external_dependency_connections"
    "requiredKeys" (list
      .Values.externalServices.connectionSecret.keys.postgresUrl
      .Values.externalServices.connectionSecret.keys.gatewayMigrationDsn
      .Values.externalServices.connectionSecret.keys.redisUrl
      .Values.externalServices.connectionSecret.keys.qdrantUrl
      .Values.externalServices.connectionSecret.keys.neo4jUri
      .Values.externalServices.connectionSecret.keys.neo4jUsername
      .Values.externalServices.connectionSecret.keys.neo4jPassword
      .Values.externalServices.connectionSecret.keys.keycloakInternalUrl
      .Values.externalServices.connectionSecret.keys.bgeEmbeddingsUrl
      .Values.externalServices.connectionSecret.keys.llmFastUrl
      .Values.externalServices.connectionSecret.keys.llmDeepUrl
      .Values.externalServices.connectionSecret.keys.transformerUrl
    )
  ) -}}
{{- end -}}

{{- if .Values.externalServices.trustBundle.existingSecret -}}
  {{- $optionalSecrets = append $optionalSecrets (dict
    "name" (include "syncratic-phase1.externalTrustBundleSecretName" .)
    "provider" "cluster"
    "purpose" "external_dependency_trust_bundle"
    "requiredKeys" (list .Values.externalServices.trustBundle.key)
  ) -}}
{{- else if or .Values.externalServices.trustBundle.existingConfigMap .Values.materialPolicy.requireExternalTrustBundle -}}
  {{- $optionalConfigMaps = append $optionalConfigMaps (dict
    "name" (include "syncratic-phase1.externalTrustBundleConfigMapName" .)
    "provider" "cluster"
    "purpose" "external_dependency_trust_bundle"
    "requiredKeys" (list .Values.externalServices.trustBundle.key)
  ) -}}
{{- end -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncratic-phase1.materialContractConfigMapName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
data:
  contract.yaml: |
    chart: syncratic-phase1
    release: {{ .Release.Name | quote }}
    policy:
      sourceMode: {{ .Values.materialPolicy.sourceMode | quote }}
      manager: {{ .Values.materialPolicy.manager | quote }}
      publishContract: {{ .Values.materialPolicy.publishContract }}
      requireExternalConnectionSecret: {{ .Values.materialPolicy.requireExternalConnectionSecret }}
      requireExternalTrustBundle: {{ .Values.materialPolicy.requireExternalTrustBundle }}
      requireConnectedControlPlaneMtls: {{ .Values.materialPolicy.requireConnectedControlPlaneMtls }}
    requiredSecrets:
{{ toYaml $requiredSecrets | indent 6 }}
    requiredConfigMaps:
{{ toYaml $requiredConfigMaps | indent 6 }}
    optionalSecrets:
{{ toYaml $optionalSecrets | indent 6 }}
    optionalConfigMaps:
{{ toYaml $optionalConfigMaps | indent 6 }}
{{- end }}
