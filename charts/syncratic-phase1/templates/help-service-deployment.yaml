{{- if .Values.help.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-help
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.help.replicaCount }}
  selector:
    matchLabels:
      {{- include "syncratic-phase1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: help
  template:
    metadata:
      labels:
        {{- include "syncratic-phase1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: help
      {{- with .Values.help.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: help
          image: "{{ include "syncratic-phase1.imageRef" (dict "Values" .Values "image" .Values.help.image) }}"
          imagePullPolicy: {{ .Values.help.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.help.service.port }}
          env:
            - name: HELP_DB_PATH
              value: /var/lib/help/help.db
            - name: HELP_GATEWAY_BASE_URL
              value: http://{{ include "syncratic-phase1.fullname" . }}-gateway:{{ .Values.gateway.service.port }}
            - name: HELP_GATEWAY_TOKEN_FILE
              value: {{ printf "/run/secrets/help-gateway/%s" .Values.help.gatewayTokenSecret.keys.helpGatewayToken | quote }}
            - name: HELP_TENANT_ID
              value: {{ .Values.help.tenantId | quote }}
            {{- include "syncratic-phase1.renderMapEnv" (dict "root" . "values" .Values.help.extraEnv) | nindent 12 }}
          volumeMounts:
            - name: help-data
              mountPath: /var/lib/help
            - name: help-gateway-secret
              mountPath: /run/secrets/help-gateway
              readOnly: true
          startupProbe:
            {{- toYaml .Values.help.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.help.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.help.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.help.resources | nindent 12 }}
      volumes:
        - name: help-data
          persistentVolumeClaim:
            claimName: {{ default (include "syncratic-phase1.helpDataPvcName" .) .Values.help.persistence.existingClaim }}
        - name: help-gateway-secret
          secret:
            secretName: {{ include "syncratic-phase1.helpGatewayTokenSecretName" . }}
{{- end }}
