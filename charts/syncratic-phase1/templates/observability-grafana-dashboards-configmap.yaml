{{- if and .Values.observability.enabled .Values.observability.grafana.dashboards.bundledEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncratic-phase1.observabilityGrafanaOverviewDashboardConfigMapName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
data:
  syncratic-overview.json: |
{{ .Files.Get "monitoring/grafana/dashboards/syncratic-overview.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncratic-phase1.observabilityGrafanaIngestionExplorerDashboardConfigMapName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
data:
  syncratic-ingestion-explorer.json: |
{{ .Files.Get "monitoring/grafana/dashboards/syncratic-ingestion-explorer.json" | indent 4 }}
{{- end }}
