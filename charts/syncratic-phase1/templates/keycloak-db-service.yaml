{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncratic-phase1.keycloakDbServiceName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.keycloak.database.service.type }}
  selector:
    {{- include "syncratic-phase1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
  ports:
    - name: postgres
      port: {{ .Values.keycloak.database.service.port }}
      targetPort: postgres
{{- end }}
