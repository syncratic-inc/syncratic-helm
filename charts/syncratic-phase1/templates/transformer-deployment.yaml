{{- if .Values.transformer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-transformer
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  {{- if not .Values.transformer.autoscaling.enabled }}
  replicas: {{ .Values.transformer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "syncratic-phase1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: transformer
  template:
    metadata:
      labels:
        {{- include "syncratic-phase1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: transformer
      {{- with .Values.transformer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: transformer
          image: "{{ include "syncratic-phase1.imageRef" (dict "Values" .Values "image" .Values.transformer.image) }}"
          imagePullPolicy: {{ .Values.transformer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.transformer.service.port }}
          env:
            {{- include "syncratic-phase1.renderMapEnv" (dict "root" . "values" .Values.transformer.extraEnv) | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.transformer.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.transformer.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.transformer.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.transformer.resources | nindent 12 }}
{{- end }}
