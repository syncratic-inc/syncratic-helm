{{- if and .Values.licensing.enabled .Values.licensing.renewal.enabled }}
{{- if ne (.Values.licensing.controlPlane.mode | lower) "connected" }}
{{- fail "licensing.renewal.enabled requires licensing.controlPlane.mode=connected" }}
{{- end }}
{{- if not .Values.registration.enabled }}
{{- fail "licensing.renewal.enabled requires registration.enabled=true" }}
{{- end }}
{{- if not (include "syncratic-phase1.licensingControlPlaneTlsClientSecretName" . | trim) }}
{{- fail "licensing.renewal.enabled requires licensing.controlPlane.tls.clientSecret" }}
{{- end }}
{{- if and (not .Values.licensing.renewal.runtimeOutputSecret.create) (not .Values.licensing.renewal.runtimeOutputSecret.existingSecret) }}
{{- fail "licensing.renewal.enabled requires licensing.renewal.runtimeOutputSecret.existingSecret or create=true" }}
{{- end }}
{{- end }}
