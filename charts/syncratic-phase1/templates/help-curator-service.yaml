{{- if and .Values.help.enabled .Values.help.curator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-help-curator
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.help.curator.service.type }}
  selector:
    {{- include "syncratic-phase1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: help-curator
  ports:
    - name: http
      port: {{ .Values.help.curator.service.port }}
      targetPort: http
{{- end }}
