{{- if .Values.llmDeep.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-llm-deep
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.llmDeep.service.type }}
  selector:
    {{- include "syncratic-phase1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm-deep
  ports:
    - name: http
      port: {{ .Values.llmDeep.service.port }}
      targetPort: http
{{- end }}
