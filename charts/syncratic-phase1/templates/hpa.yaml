{{- if and .Values.gateway.enabled .Values.gateway.autoscaling.enabled }}
{{- if not (or .Values.gateway.autoscaling.targetCPUUtilizationPercentage .Values.gateway.autoscaling.targetMemoryUtilizationPercentage) -}}
  {{- fail "gateway.autoscaling.enabled=true requires targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" -}}
{{- end }}
{{- if and .Values.transformer.enabled .Values.transformer.autoscaling.enabled }}
---
{{- if not (or .Values.transformer.autoscaling.targetCPUUtilizationPercentage .Values.transformer.autoscaling.targetMemoryUtilizationPercentage) -}}
  {{- fail "transformer.autoscaling.enabled=true requires targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" -}}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-transformer
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "syncratic-phase1.fullname" . }}-transformer
  minReplicas: {{ .Values.transformer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.transformer.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.transformer.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.transformer.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.transformer.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.transformer.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-gateway
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "syncratic-phase1.fullname" . }}-gateway
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.gateway.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- if and .Values.frontend.enabled .Values.frontend.autoscaling.enabled }}
---
{{- if not (or .Values.frontend.autoscaling.targetCPUUtilizationPercentage .Values.frontend.autoscaling.targetMemoryUtilizationPercentage) -}}
  {{- fail "frontend.autoscaling.enabled=true requires targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" -}}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-frontend
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "syncratic-phase1.fullname" . }}-frontend
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- if .Values.runtimeWorkers.enabled }}
{{- range $worker := .Values.runtimeWorkers.workers }}
{{- if and $worker.enabled $worker.autoscaling.enabled }}
---
{{- if not (or $worker.autoscaling.targetCPUUtilizationPercentage $worker.autoscaling.targetMemoryUtilizationPercentage) -}}
  {{- fail (printf "runtimeWorkers worker %s autoscaling.enabled=true requires targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" $worker.name) -}}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "syncratic-phase1.fullname" $ }}-worker-{{ $worker.name }}
  labels:
    {{- include "syncratic-phase1.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "syncratic-phase1.fullname" $ }}-worker-{{ $worker.name }}
  minReplicas: {{ $worker.autoscaling.minReplicas }}
  maxReplicas: {{ $worker.autoscaling.maxReplicas }}
  metrics:
    {{- if $worker.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $worker.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $worker.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
