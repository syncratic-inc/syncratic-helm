{{- if and .Values.licensing.enabled .Values.licensing.renewal.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "syncratic-phase1.licensingRenewalServiceAccountName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "syncratic-phase1.licensingRenewalServiceAccountName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "syncratic-phase1.licensingControlPlaneTlsClientSecretName" . | quote }}
      - {{ include "syncratic-phase1.licensingRenewalRuntimeOutputSecretName" . | quote }}
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "syncratic-phase1.licensingRenewalServiceAccountName" . }}
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "syncratic-phase1.licensingRenewalServiceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "syncratic-phase1.licensingRenewalServiceAccountName" . }}
{{- end }}
