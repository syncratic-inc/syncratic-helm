{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncratic-phase1.fullname" . }}-postgres-init
  labels:
    {{- include "syncratic-phase1.labels" . | nindent 4 }}
data:
  00-create-compatibility-roles.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'syncratic_app') THEN
        CREATE ROLE syncratic_app NOLOGIN;
      END IF;
    END
    $$;
  01-create-orchestrator-db.sql: |
    CREATE DATABASE {{ .Values.postgres.contract.orchestratorDatabase }};
{{- end }}
