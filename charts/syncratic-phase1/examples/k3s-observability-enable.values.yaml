auth:
  runtimeSecret:
    create: false
    existingSecret: syncratic-phase1-auth-runtime

keycloak:
  adminSecret:
    create: false
    existingSecret: syncratic-phase1-keycloak-admin
  database:
    create: false
    existingSecret: syncratic-phase1-keycloak-db
  realm:
    create: false
    existingConfigMap: syncratic-phase1-keycloak-realm

observability:
  enabled: true
  path: /observability
  grafana:
    adminSecret:
      create: false
      existingSecret: syncratic-phase1-observability-grafana-admin
    oauth:
      clientId: grafana-observability
      roleAttributePath: "contains(roles[*], 'super_admin') && 'Admin' || contains(roles[*], 'syncratic-admin') && 'Admin' || contains(roles[*], 'admin') && 'Admin' || 'None'"
    datasources:
      prometheus:
        enabled: false
        url: ""
    dashboards:
      providerEnabled: true
      bundledEnabled: true
