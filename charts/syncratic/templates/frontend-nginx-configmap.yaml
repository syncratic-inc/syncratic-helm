{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncratic.fullname" . }}-frontend-nginx
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      client_max_body_size {{ .Values.frontend.nginx.clientMaxBodySize }};

      root /usr/share/nginx/html;
      index index.html;
      location /auth/ {
        proxy_pass http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }

      location /gateway/ {
        proxy_pass http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }

      location /api/ {
        proxy_pass http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }

      location /llmfs/ {
        proxy_pass http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }

      location /reports/ {
        proxy_pass http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }

      location /assurance-criteria {
        proxy_pass http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }

      {{- if .Values.evaluation.enabled }}
      location /eval/ {
        proxy_pass http://{{ include "syncratic.fullname" . }}-evaluation-agent:{{ .Values.evaluation.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      }
      {{- end }}

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
{{- end }}
