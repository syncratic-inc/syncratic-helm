{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncratic.fullname" . }}-frontend
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "syncratic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "syncratic.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-configmap.yaml") . | sha256sum }}
      {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ include "syncratic.imageRef" (dict "Values" .Values "image" .Values.frontend.image) }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.authRuntimeSecretName" . }}
                  key: {{ .Values.auth.runtimeSecret.keys.nextAuthSecret }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.authRuntimeSecretName" . }}
                  key: {{ .Values.auth.runtimeSecret.keys.keycloakClientSecret }}
            - name: GATEWAY_BASE_URL
              value: http://{{ include "syncratic.fullname" . }}-gateway:{{ .Values.gateway.service.port }}
            - name: NEXTAUTH_URL
              value: {{ include "syncratic.publicAppUrl" . | quote }}
            - name: NEXT_PUBLIC_APP_URL
              value: {{ include "syncratic.publicAppUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.externalServices.keycloakRealm | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ include "syncratic.publicKeycloakIssuerUrl" . | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.frontendClientId | quote }}
            - name: GATEWAY_BOOTSTRAP_PATH
              value: {{ .Values.auth.gatewayBootstrapPath | quote }}
            {{- include "syncratic.renderMapEnv" (dict "root" . "values" .Values.frontend.extraEnv) | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.frontend.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "syncratic.fullname" . }}-frontend-nginx
{{- end }}
