{{- if .Values.keycloak.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "syncratic.fullname" . }}-keycloak-public-url-reconcile
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-public-url-reconcile
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "syncratic.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-public-url-reconcile
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-public-url-reconcile
          image: "{{ include "syncratic.imageRef" (dict "Values" .Values "image" .Values.keycloak.image) }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              for i in $(seq 1 60); do
                if /opt/keycloak/bin/kcadm.sh config credentials \
                  --server "$KEYCLOAK_ADMIN_SERVER" \
                  --realm master \
                  --user "$KEYCLOAK_ADMIN" \
                  --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; then
                  break
                fi
                if [ "$i" = "60" ]; then
                  echo "Keycloak admin API was not ready for public URL reconciliation" >&2
                  exit 1
                fi
                sleep 5
              done

              /opt/keycloak/bin/kcadm.sh update "realms/$KEYCLOAK_REALM" \
                -s "attributes.frontendUrl=$KEYCLOAK_PUBLIC_FRONTEND_URL" \
                -s "loginTheme=syncratic" \
                -s "emailTheme=syncratic"

              scope_id() {
                /opt/keycloak/bin/kcadm.sh get client-scopes -r "$KEYCLOAK_REALM" --fields id,name |
                  sed -n "/\"name\"[ ]*:[ ]*\"$1\"/{x;p;}; h" |
                  sed -n 's/.*"id"[ ]*:[ ]*"\([^"]*\)".*/\1/p' |
                  head -n 1
              }

              ensure_scope() {
                scope_name="$1"
                current_scope_id="$(scope_id "$scope_name")"
                if [ -z "$current_scope_id" ]; then
                  /opt/keycloak/bin/kcadm.sh create client-scopes -r "$KEYCLOAK_REALM" \
                    -s "name=$scope_name" \
                    -s "protocol=openid-connect" >/dev/null
                  current_scope_id="$(scope_id "$scope_name")"
                fi
                if [ -z "$current_scope_id" ]; then
                  echo "Keycloak client scope $scope_name could not be reconciled" >&2
                  exit 1
                fi
                echo "$current_scope_id"
              }

              ensure_user_property_mapper() {
                mapper_scope_id="$1"
                mapper_name="$2"
                user_attribute="$3"
                claim_name="$4"
                json_type="$5"
                if /opt/keycloak/bin/kcadm.sh get "client-scopes/$mapper_scope_id/protocol-mappers/models" -r "$KEYCLOAK_REALM" --fields name |
                  grep -q "\"name\"[ ]*:[ ]*\"$mapper_name\""; then
                  return 0
                fi
                printf '%s\n' "{\"name\":\"$mapper_name\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-usermodel-property-mapper\",\"consentRequired\":false,\"config\":{\"user.attribute\":\"$user_attribute\",\"claim.name\":\"$claim_name\",\"jsonType.label\":\"$json_type\",\"id.token.claim\":\"true\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"true\"}}" > /tmp/keycloak-mapper.json
                /opt/keycloak/bin/kcadm.sh create "client-scopes/$mapper_scope_id/protocol-mappers/models" \
                  -r "$KEYCLOAK_REALM" \
                  -f /tmp/keycloak-mapper.json >/dev/null
              }

              EMAIL_SCOPE_ID="$(ensure_scope email)"
              PROFILE_SCOPE_ID="$(ensure_scope profile)"

              ensure_user_property_mapper "$EMAIL_SCOPE_ID" email email email String
              ensure_user_property_mapper "$EMAIL_SCOPE_ID" email_verified emailVerified email_verified boolean
              ensure_user_property_mapper "$PROFILE_SCOPE_ID" username username preferred_username String
              ensure_user_property_mapper "$PROFILE_SCOPE_ID" given_name firstName given_name String
              ensure_user_property_mapper "$PROFILE_SCOPE_ID" family_name lastName family_name String

              CLIENT_UUID="$(/opt/keycloak/bin/kcadm.sh get clients -r "$KEYCLOAK_REALM" -q clientId="$KEYCLOAK_CLIENT_ID" --fields id | sed -n 's/.*"id"[ ]*:[ ]*"\([^"]*\)".*/\1/p' | head -n 1)"
              if [ -z "$CLIENT_UUID" ]; then
                echo "Keycloak client $KEYCLOAK_CLIENT_ID was not found" >&2
                exit 1
              fi
              /opt/keycloak/bin/kcadm.sh update "clients/$CLIENT_UUID" -r "$KEYCLOAK_REALM" \
                -s "rootUrl=$SYNCRATIC_PUBLIC_APP_URL" \
                -s "adminUrl=$SYNCRATIC_PUBLIC_APP_URL" \
                -s "redirectUris=[\"$SYNCRATIC_PUBLIC_APP_URL/auth/callback\"]" \
                -s "webOrigins=[\"$SYNCRATIC_PUBLIC_APP_URL\"]"

              for default_scope in roles email profile; do
                DEFAULT_SCOPE_ID="$(scope_id "$default_scope")"
                if [ -n "$DEFAULT_SCOPE_ID" ] && ! /opt/keycloak/bin/kcadm.sh get "clients/$CLIENT_UUID/default-client-scopes" -r "$KEYCLOAK_REALM" --fields name |
                  grep -q "\"name\"[ ]*:[ ]*\"$default_scope\""; then
                  /opt/keycloak/bin/kcadm.sh update "clients/$CLIENT_UUID/default-client-scopes/$DEFAULT_SCOPE_ID" \
                    -r "$KEYCLOAK_REALM" >/dev/null
                fi
              done

              echo "Keycloak public URL reconciled for $KEYCLOAK_REALM: $KEYCLOAK_PUBLIC_FRONTEND_URL"
          env:
            - name: KEYCLOAK_ADMIN_SERVER
              value: {{ include "syncratic.keycloakInternalUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.externalServices.keycloakRealm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.frontendClientId | quote }}
            - name: SYNCRATIC_PUBLIC_APP_URL
              value: {{ include "syncratic.publicAppUrl" . | quote }}
            - name: KEYCLOAK_PUBLIC_FRONTEND_URL
              value: {{ include "syncratic.publicAuthBaseUrl" . | quote }}
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.keycloakAdminSecretName" . }}
                  key: {{ .Values.keycloak.adminSecret.keys.username }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.keycloakAdminSecretName" . }}
                  key: {{ .Values.keycloak.adminSecret.keys.password }}
{{- end }}
