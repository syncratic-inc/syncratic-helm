{{- if .Values.runtimeWorkers.enabled }}
{{- range $worker := .Values.runtimeWorkers.workers }}
{{- if $worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncratic.fullname" $ }}-worker-{{ $worker.name }}
  labels:
    {{- include "syncratic.labels" $ | nindent 4 }}
spec:
  {{- if not $worker.autoscaling.enabled }}
  replicas: {{ $worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "syncratic.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: runtime-worker
      syncratic.co/worker-mode: {{ $worker.mode | quote }}
  template:
    metadata:
      labels:
        {{- include "syncratic.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: runtime-worker
        syncratic.co/worker-mode: {{ $worker.mode | quote }}
      {{- with $.Values.runtimeWorkers.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runtime-worker
          image: "{{ include "syncratic.imageRef" (dict "Values" $.Values "image" $.Values.runtimeWorkers.image) }}"
          imagePullPolicy: {{ $.Values.runtimeWorkers.image.pullPolicy }}
          command:
            - python
            - -m
            - workers.llmfs_worker
            - {{ $worker.mode | quote }}
          env:
            - name: LLMFS_ROOT
              value: {{ $.Values.gateway.persistence.docs.mountPath | quote }}
            - name: LLMFS_MOUNT_ROOT
              value: {{ $.Values.gateway.persistence.docs.mountPath | quote }}
            - name: LLMFS_UPLOAD_ROOT
              value: /syncrauploads
            - name: LLM_MODEL_BINDINGS_BOOTSTRAP_SYNC
              value: {{ $.Values.modelBindings.bootstrapSync | quote }}
            - name: LLM_MODEL_BINDINGS_DB_ONLY
              value: {{ $.Values.modelBindings.dbOnly | quote }}
            {{- if or $.Values.externalServices.trustBundle.existingConfigMap $.Values.externalServices.trustBundle.existingSecret }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ printf "%s/%s" $.Values.externalServices.trustBundle.mountPath $.Values.externalServices.trustBundle.key | quote }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" $.Values.externalServices.trustBundle.mountPath $.Values.externalServices.trustBundle.key | quote }}
            {{- end }}
            {{- if $.Values.keycloak.enabled }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ include "syncratic.keycloakInternalUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.keycloakInternalUrl }}
            {{- else }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ $.Values.externalServices.keycloakInternalUrl | quote }}
            {{- end }}
            - name: KEYCLOAK_REALM
              value: {{ $.Values.externalServices.keycloakRealm | quote }}
            {{- if $.Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "syncratic.redisUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.redisUrl }}
            {{- else }}
            - name: REDIS_URL
              value: {{ $.Values.externalServices.redisUrl | quote }}
            {{- end }}
            {{- if $.Values.neo4j.enabled }}
            - name: NEO4J_URI
              value: {{ include "syncratic.neo4jUri" $ | quote }}
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" $ }}
                  key: NEO4J_PASSWORD
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.neo4jUri }}
            {{- else }}
            - name: NEO4J_URI
              value: {{ $.Values.externalServices.neo4jUri | quote }}
            {{- end }}
            {{- if and (not $.Values.neo4j.enabled) $.Values.externalServices.connectionSecret.existingSecret }}
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.neo4jUsername }}
            {{- else if not $.Values.neo4j.enabled }}
            - name: NEO4J_USERNAME
              value: neo4j
            {{- end }}
            {{- if and (not $.Values.neo4j.enabled) $.Values.externalServices.connectionSecret.existingSecret }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.neo4jPassword }}
            {{- else if not $.Values.neo4j.enabled }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" $ }}
                  key: NEO4J_PASSWORD
            {{- end }}
            {{- if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.llmDeepUrl }}
            {{- else }}
            - name: LLM_URL
              value: {{ $.Values.externalServices.llmDeepUrl | quote }}
            {{- end }}
            {{- if $.Values.llmFast.enabled }}
            - name: LLM_ASK_FAST_URL
              value: {{ include "syncratic.llmFastUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_ASK_FAST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.llmFastUrl }}
            {{- else }}
            - name: LLM_ASK_FAST_URL
              value: {{ $.Values.externalServices.llmFastUrl | quote }}
            {{- end }}
            {{- if $.Values.llmFast.enabled }}
            - name: LLM_ASK_BASIC_URL
              value: {{ include "syncratic.llmFastUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_ASK_BASIC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.llmFastUrl }}
            {{- else }}
            - name: LLM_ASK_BASIC_URL
              value: {{ $.Values.externalServices.llmFastUrl | quote }}
            {{- end }}
            {{- if $.Values.llmDeep.enabled }}
            - name: LLM_ASK_DEEP_URL
              value: {{ include "syncratic.llmDeepUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_ASK_DEEP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.llmDeepUrl }}
            {{- else }}
            - name: LLM_ASK_DEEP_URL
              value: {{ $.Values.externalServices.llmDeepUrl | quote }}
            {{- end }}
            {{- if $.Values.llmDeep.enabled }}
            - name: LLMFS_GRAPH_EXTRACTION_URL
              value: {{ include "syncratic.llmDeepUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: LLMFS_GRAPH_EXTRACTION_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.llmDeepUrl }}
            {{- else }}
            - name: LLMFS_GRAPH_EXTRACTION_URL
              value: {{ $.Values.externalServices.llmDeepUrl | quote }}
            {{- end }}
            {{- if $.Values.bgeEmbeddings.enabled }}
            - name: EMBEDDING_URL
              value: {{ include "syncratic.bgeEmbeddingsUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: EMBEDDING_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.bgeEmbeddingsUrl }}
            {{- else }}
            - name: EMBEDDING_URL
              value: {{ $.Values.externalServices.bgeEmbeddingsUrl | quote }}
            {{- end }}
            {{- if $.Values.transformer.enabled }}
            - name: TRANSFORMER_SERVICE_URL
              value: {{ printf "http://%s-transformer:%v" (include "syncratic.fullname" $) $.Values.transformer.service.port | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: TRANSFORMER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.transformerUrl }}
            {{- else }}
            - name: TRANSFORMER_SERVICE_URL
              value: {{ $.Values.externalServices.transformerUrl | quote }}
            {{- end }}
            - name: ENTITLEMENT_SERVICE_URL
              value: http://{{ include "syncratic.fullname" $ }}-licensing:{{ $.Values.licensing.service.port }}
            - name: ENTITLEMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" $ }}
                  key: ENTITLEMENT_SERVICE_TOKEN
            - name: CONNECTOR_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" $ }}
                  key: CONNECTOR_TOKEN_ENCRYPTION_KEY
            {{- if $.Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.postgresAuthSecretName" $ }}
                  key: {{ $.Values.postgres.auth.keys.applicationDsn }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.postgresUrl }}
            {{- else if $.Values.externalServices.postgresUrl }}
            - name: DATABASE_URL
              value: {{ $.Values.externalServices.postgresUrl | quote }}
            {{- end }}
            {{- if $.Values.qdrant.enabled }}
            - name: QDRANT_URL
              value: {{ include "syncratic.qdrantUrl" $ | quote }}
            {{- else if $.Values.externalServices.connectionSecret.existingSecret }}
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" $ }}
                  key: {{ $.Values.externalServices.connectionSecret.keys.qdrantUrl }}
            {{- else if $.Values.externalServices.qdrantUrl }}
            - name: QDRANT_URL
              value: {{ $.Values.externalServices.qdrantUrl | quote }}
            {{- end }}
            {{- include "syncratic.renderMapEnv" (dict "root" $ "values" $worker.extraEnv) | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: /syncrauploads
            {{- if or $.Values.externalServices.trustBundle.existingConfigMap $.Values.externalServices.trustBundle.existingSecret }}
            - name: external-trust-bundle
              mountPath: {{ $.Values.externalServices.trustBundle.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $.Values.gateway.persistence.docs.enabled }}
            - name: docs
              mountPath: {{ $.Values.gateway.persistence.docs.mountPath }}
              readOnly: true
            {{- end }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tr '\000' ' ' < /proc/1/cmdline | grep -q 'workers.llmfs_worker {{ $worker.mode }}' || exit 1
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tr '\000' ' ' < /proc/1/cmdline | grep -q 'workers.llmfs_worker {{ $worker.mode }}' || exit 1
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml (default $.Values.runtimeWorkers.resources $worker.resources) | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ default (include "syncratic.gatewayUploadsPvcName" $) $.Values.gateway.persistence.uploads.existingClaim }}
        {{- if or $.Values.externalServices.trustBundle.existingConfigMap $.Values.externalServices.trustBundle.existingSecret }}
        - name: external-trust-bundle
          {{- if $.Values.externalServices.trustBundle.existingSecret }}
          secret:
            secretName: {{ include "syncratic.externalTrustBundleSecretName" $ }}
          {{- else }}
          configMap:
            name: {{ include "syncratic.externalTrustBundleConfigMapName" $ }}
          {{- end }}
        {{- end }}
        {{- if $.Values.gateway.persistence.docs.enabled }}
        - name: docs
          persistentVolumeClaim:
            claimName: {{ $.Values.gateway.persistence.docs.existingClaim }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
