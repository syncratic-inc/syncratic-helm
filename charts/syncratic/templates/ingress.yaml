{{- if .Values.ingress.enabled }}
{{- $annotations := dict -}}
{{- with .Values.ingress.annotations }}
  {{- $annotations = merge $annotations . -}}
{{- end }}
{{- if (.Values.ingress.maxBodySize | trim) }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" .Values.ingress.maxBodySize -}}
{{- end }}
{{- if and .Values.ingress.tlsPolicy.certManager.enabled (.Values.ingress.tlsPolicy.certManager.clusterIssuer | trim) }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.ingress.tlsPolicy.certManager.clusterIssuer -}}
{{- end }}
{{- if and .Values.ingress.tlsPolicy.certManager.enabled (.Values.ingress.tlsPolicy.certManager.issuer | trim) }}
  {{- $_ := set $annotations "cert-manager.io/issuer" .Values.ingress.tlsPolicy.certManager.issuer -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "syncratic.fullname" . }}
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.frontendHost }}
    - host: {{ .Values.ingress.frontendHost }}
      http:
        paths:
          {{- if .Values.observability.enabled }}
          - path: {{ include "syncratic.observabilityPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.observabilityGrafanaName" . }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.evaluation.enabled }}
          - path: /eval
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-evaluation-agent
                port:
                  name: http
          {{- end }}
          {{- if .Values.help.enabled }}
          - path: /help
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-help
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-frontend
                port:
                  name: http
    {{- end }}
    {{- if .Values.ingress.gatewayHost }}
    - host: {{ .Values.ingress.gatewayHost }}
      http:
        paths:
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          {{- if .Values.gateway.exposeLegacyLlmfs }}
          - path: /llmfs
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          {{- if or (eq .Values.auth.exposureMode "gatewayFacade") (and (not .Values.ingress.authHost) (not .Values.keycloak.enabled)) }}
          - path: {{ include "syncratic.authPublicPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          {{- else if .Values.keycloak.enabled }}
          - path: {{ .Values.auth.gatewayBootstrapPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          {{- end }}
          - path: /insights
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
    {{- end }}
    {{- if and .Values.ingress.authHost (ne .Values.auth.exposureMode "gatewayFacade") }}
    - host: {{ .Values.ingress.authHost }}
      http:
        paths:
          {{- if .Values.keycloak.enabled }}
          - path: {{ .Values.auth.gatewayBootstrapPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.keycloakServiceName" . }}
                port:
                  name: http
          {{- else }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "syncratic.fullname" . }}-gateway
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
