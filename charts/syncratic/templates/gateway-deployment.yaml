{{- if .Values.gateway.enabled }}
{{- $networkFileShares := default dict .Values.gateway.networkFileShares }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncratic.fullname" . }}-gateway
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "syncratic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "syncratic.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ include "syncratic.imageRef" (dict "Values" .Values "image" .Values.gateway.image) }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --no-access-log
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
          env:
            - name: LLMFS_ROOT
              value: {{ .Values.gateway.persistence.docs.mountPath | quote }}
            - name: LLMFS_MOUNT_ROOT
              value: {{ .Values.gateway.persistence.docs.mountPath | quote }}
            - name: LLMFS_UPLOAD_ROOT
              value: /syncrauploads
            - name: AUTH_PUBLIC_BASE_URL
              value: {{ include "syncratic.publicAuthBaseUrl" . | quote }}
            - name: NEXTAUTH_URL
              value: {{ include "syncratic.publicAppUrl" . | quote }}
            - name: NEXT_PUBLIC_APP_URL
              value: {{ include "syncratic.publicAppUrl" . | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ include "syncratic.publicKeycloakIssuerUrl" . | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ printf "%s/protocol/openid-connect/certs" (include "syncratic.internalKeycloakIssuerUrl" .) | quote }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ printf "%s/protocol/openid-connect/token" (include "syncratic.internalKeycloakIssuerUrl" .) | quote }}
            - name: KEYCLOAK_PUBLIC_BASE_PATH
              value: {{ include "syncratic.authPublicPath" . | quote }}
            - name: CONNECTOR_OAUTH_REDIRECT_URL
              value: {{ include "syncratic.connectorOAuthRedirectUrl" . | quote }}
            {{- if and .Values.help.enabled .Values.help.curator.enabled }}
            - name: HELP_CURATOR_URL
              value: {{ printf "http://%s-help-curator:%v" (include "syncratic.fullname" .) .Values.help.curator.service.port | quote }}
            {{- end }}
            {{- if (default false $networkFileShares.enabled) }}
            - name: LLMFS_NETWORK_SHARE_ALLOWED_ROOTS
              value: {{ default "" $networkFileShares.allowedRoots | quote }}
            {{- end }}
            - name: LLM_MODEL_BINDINGS_BOOTSTRAP_SYNC
              value: {{ .Values.modelBindings.bootstrapSync | quote }}
            - name: LLM_MODEL_BINDINGS_DB_ONLY
              value: {{ .Values.modelBindings.dbOnly | quote }}
            {{- if or .Values.externalServices.trustBundle.existingConfigMap .Values.externalServices.trustBundle.existingSecret }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ printf "%s/%s" .Values.externalServices.trustBundle.mountPath .Values.externalServices.trustBundle.key | quote }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.externalServices.trustBundle.mountPath .Values.externalServices.trustBundle.key | quote }}
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ include "syncratic.keycloakInternalUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.keycloakInternalUrl }}
            {{- else }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ .Values.externalServices.keycloakInternalUrl | quote }}
            {{- end }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.externalServices.keycloakRealm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.frontendClientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.authRuntimeSecretName" . }}
                  key: {{ .Values.auth.runtimeSecret.keys.keycloakClientSecret }}
            {{- if .Values.auth.identityProvisioning.enabled }}
            - name: IDENTITY_PROVIDER
              value: {{ .Values.auth.identityProvisioning.provider | quote }}
            - name: IDENTITY_PROVISIONING_ENABLED
              value: {{ .Values.auth.identityProvisioning.enabled | quote }}
            - name: IDENTITY_SEND_REQUIRED_ACTION_EMAILS
              value: {{ .Values.auth.identityProvisioning.sendRequiredActionEmails | quote }}
            - name: IDENTITY_DEFAULT_REQUIRED_ACTIONS
              value: {{ .Values.auth.identityProvisioning.defaultRequiredActions | quote }}
            - name: INITIAL_OPERATOR_IDENTITY_PROVISIONING_ENABLED
              value: {{ .Values.auth.identityProvisioning.initialOperatorEnabled | quote }}
            - name: KEYCLOAK_ADMIN_REALM
              value: {{ default .Values.externalServices.keycloakRealm .Values.auth.identityProvisioning.adminRealm | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.auth.identityProvisioning.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET_FILE
              value: {{ printf "%s/%s" .Values.auth.identityProvisioning.secret.mountPath .Values.auth.identityProvisioning.secret.keys.adminClientSecret | quote }}
            {{- end }}
            {{- if .Values.auth.bootstrapSmtp.enabled }}
            - name: SMTP_HOST
              value: {{ .Values.auth.bootstrapSmtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.auth.bootstrapSmtp.port | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.auth.bootstrapSmtp.username | quote }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSmtpSecretName" . }}
                  key: {{ .Values.auth.bootstrapSmtp.passwordSecret.key }}
            - name: SMTP_USE_STARTTLS
              value: {{ .Values.auth.bootstrapSmtp.useStarttls | quote }}
            - name: SMTP_USE_SSL
              value: {{ .Values.auth.bootstrapSmtp.useSsl | quote }}
            - name: SMTP_FROM_EMAIL
              value: {{ .Values.auth.bootstrapSmtp.fromEmail | quote }}
            - name: SMTP_FROM_NAME
              value: {{ .Values.auth.bootstrapSmtp.fromName | quote }}
            {{- if .Values.auth.bootstrapSmtp.replyTo }}
            - name: SMTP_REPLY_TO
              value: {{ .Values.auth.bootstrapSmtp.replyTo | quote }}
            {{- end }}
            {{- end }}
            - name: NOTIFICATION_DISPATCHER_ENABLED
              value: {{ .Values.gateway.notifications.dispatcher.enabled | quote }}
            - name: NOTIFICATION_DISPATCH_BATCH_SIZE
              value: {{ .Values.gateway.notifications.dispatcher.batchSize | quote }}
            - name: NOTIFICATION_DISPATCH_INTERVAL_S
              value: {{ .Values.gateway.notifications.dispatcher.intervalSeconds | quote }}
            - name: NOTIFICATION_DISPATCH_MAX_ATTEMPTS
              value: {{ .Values.gateway.notifications.dispatcher.maxAttempts | quote }}
            - name: NOTIFICATION_DISPATCH_RETRY_BASE_S
              value: {{ .Values.gateway.notifications.dispatcher.retryBaseSeconds | quote }}
            {{- if .Values.gateway.notifications.webhook.enabled }}
            - name: NOTIFICATION_WEBHOOK_URL
              value: {{ .Values.gateway.notifications.webhook.url | quote }}
            - name: NOTIFICATION_WEBHOOK_TIMEOUT_S
              value: {{ .Values.gateway.notifications.webhook.timeoutSeconds | quote }}
            {{- if or .Values.gateway.notifications.webhook.tokenSecret.existingSecret .Values.gateway.notifications.webhook.tokenSecret.create }}
            - name: NOTIFICATION_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.gatewayNotificationWebhookSecretName" . }}
                  key: {{ .Values.gateway.notifications.webhook.tokenSecret.key }}
            {{- end }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "syncratic.redisUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.redisUrl }}
            {{- else }}
            - name: REDIS_URL
              value: {{ .Values.externalServices.redisUrl | quote }}
            {{- end }}
            {{- if .Values.neo4j.enabled }}
            - name: NEO4J_URI
              value: {{ include "syncratic.neo4jUri" . | quote }}
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" . }}
                  key: NEO4J_PASSWORD
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.neo4jUri }}
            {{- else }}
            - name: NEO4J_URI
              value: {{ .Values.externalServices.neo4jUri | quote }}
            {{- end }}
            {{- if and (not .Values.neo4j.enabled) .Values.externalServices.connectionSecret.existingSecret }}
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.neo4jUsername }}
            {{- else if not .Values.neo4j.enabled }}
            - name: NEO4J_USERNAME
              value: neo4j
            {{- end }}
            {{- if and (not .Values.neo4j.enabled) .Values.externalServices.connectionSecret.existingSecret }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.neo4jPassword }}
            {{- else if not .Values.neo4j.enabled }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" . }}
                  key: NEO4J_PASSWORD
            {{- end }}
            {{- if .Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.llmDeepUrl }}
            {{- else }}
            - name: LLM_URL
              value: {{ .Values.externalServices.llmDeepUrl | quote }}
            {{- end }}
            {{- if .Values.llmFast.enabled }}
            - name: LLM_ASK_FAST_URL
              value: {{ include "syncratic.llmFastUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_ASK_FAST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.llmFastUrl }}
            {{- else }}
            - name: LLM_ASK_FAST_URL
              value: {{ .Values.externalServices.llmFastUrl | quote }}
            {{- end }}
            {{- if .Values.llmFast.enabled }}
            - name: LLM_ASK_BASIC_URL
              value: {{ include "syncratic.llmFastUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_ASK_BASIC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.llmFastUrl }}
            {{- else }}
            - name: LLM_ASK_BASIC_URL
              value: {{ .Values.externalServices.llmFastUrl | quote }}
            {{- end }}
            {{- if .Values.llmDeep.enabled }}
            - name: LLM_ASK_DEEP_URL
              value: {{ include "syncratic.llmDeepUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: LLM_ASK_DEEP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.llmDeepUrl }}
            {{- else }}
            - name: LLM_ASK_DEEP_URL
              value: {{ .Values.externalServices.llmDeepUrl | quote }}
            {{- end }}
            {{- if .Values.llmDeep.enabled }}
            - name: LLMFS_GRAPH_EXTRACTION_URL
              value: {{ include "syncratic.llmDeepUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: LLMFS_GRAPH_EXTRACTION_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.llmDeepUrl }}
            {{- else }}
            - name: LLMFS_GRAPH_EXTRACTION_URL
              value: {{ .Values.externalServices.llmDeepUrl | quote }}
            {{- end }}
            {{- if .Values.bgeEmbeddings.enabled }}
            - name: EMBEDDING_URL
              value: {{ include "syncratic.bgeEmbeddingsUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: EMBEDDING_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.bgeEmbeddingsUrl }}
            {{- else }}
            - name: EMBEDDING_URL
              value: {{ .Values.externalServices.bgeEmbeddingsUrl | quote }}
            {{- end }}
            {{- if .Values.transformer.enabled }}
            - name: TRANSFORMER_SERVICE_URL
              value: {{ printf "http://%s-transformer:%v" (include "syncratic.fullname" .) .Values.transformer.service.port | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: TRANSFORMER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.transformerUrl }}
            {{- else }}
            - name: TRANSFORMER_SERVICE_URL
              value: {{ .Values.externalServices.transformerUrl | quote }}
            {{- end }}
            - name: ENTITLEMENT_SERVICE_URL
              value: http://{{ include "syncratic.fullname" . }}-licensing:{{ .Values.licensing.service.port }}
            - name: ENTITLEMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" . }}
                  key: ENTITLEMENT_SERVICE_TOKEN
            - name: CONNECTOR_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.bootstrapSecretName" . }}
                  key: CONNECTOR_TOKEN_ENCRYPTION_KEY
            {{- if or .Values.gateway.initialOperatorBootstrapSecret.existingSecret .Values.gateway.initialOperatorBootstrapSecret.create }}
            - name: INITIAL_OPERATOR_BOOTSTRAP_FILE
              value: {{ printf "%s/%s" .Values.gateway.initialOperatorBootstrapSecret.mountPath .Values.gateway.initialOperatorBootstrapSecret.keys.bootstrapArtifact | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.postgresAuthSecretName" . }}
                  key: {{ .Values.postgres.auth.keys.applicationDsn }}
            - name: GATEWAY_MIGRATION_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.postgresAuthSecretName" . }}
                  key: {{ .Values.postgres.auth.keys.gatewayMigrationDsn }}
            - name: PGHOST
              value: {{ include "syncratic.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.contract.applicationDatabase | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.contract.applicationUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.postgresAuthSecretName" . }}
                  key: {{ .Values.postgres.auth.keys.adminPassword }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.postgresUrl }}
            - name: GATEWAY_MIGRATION_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.gatewayMigrationDsn }}
            {{- else if .Values.externalServices.postgresUrl }}
            - name: DATABASE_URL
              value: {{ .Values.externalServices.postgresUrl | quote }}
            - name: GATEWAY_MIGRATION_DSN
              value: {{ default .Values.externalServices.postgresUrl .Values.externalServices.gatewayMigrationDsn | quote }}
            {{- end }}
            {{- if .Values.qdrant.enabled }}
            - name: QDRANT_URL
              value: {{ include "syncratic.qdrantUrl" . | quote }}
            {{- else if .Values.externalServices.connectionSecret.existingSecret }}
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncratic.externalConnectionSecretName" . }}
                  key: {{ .Values.externalServices.connectionSecret.keys.qdrantUrl }}
            {{- else if .Values.externalServices.qdrantUrl }}
            - name: QDRANT_URL
              value: {{ .Values.externalServices.qdrantUrl | quote }}
            {{- end }}
            {{- if .Values.gateway.operationsReadiness.enabled }}
            {{- with .Values.gateway.operationsReadiness.paths.lesRetentionSummary }}
            - name: OPERATIONS_READINESS_LES_RETENTION_SUMMARY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.lesPolicySummary }}
            - name: OPERATIONS_READINESS_LES_POLICY_SUMMARY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.lesDueEvaluation }}
            - name: OPERATIONS_READINESS_LES_DUE_EVALUATION
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.lesOperationalEvidence }}
            - name: OPERATIONS_READINESS_LES_OPERATIONAL_EVIDENCE
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.backupManifest }}
            - name: OPERATIONS_READINESS_BACKUP_MANIFEST
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.restoreDrillSummary }}
            - name: OPERATIONS_READINESS_RESTORE_DRILL_SUMMARY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.recoveryPackageManifest }}
            - name: OPERATIONS_READINESS_RECOVERY_PACKAGE_MANIFEST
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.alertingManifest }}
            - name: OPERATIONS_READINESS_ALERTING_MANIFEST
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.accessReplaySummary }}
            - name: OPERATIONS_READINESS_ACCESS_REPLAY_SUMMARY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.connectorProofSummary }}
            - name: OPERATIONS_READINESS_CONNECTOR_PROOF_SUMMARY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.secretGovernanceManifest }}
            - name: OPERATIONS_READINESS_SECRET_GOVERNANCE_MANIFEST
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.edgeIngressProofSummary }}
            - name: OPERATIONS_READINESS_EDGE_INGRESS_PROOF_SUMMARY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.privacyEngineRuntimeConfigProof }}
            - name: OPERATIONS_READINESS_PRIVACY_ENGINE_RUNTIME_CONFIG_PROOF
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.gateway.operationsReadiness.paths.productionEvidencePackageManifest }}
            - name: OPERATIONS_READINESS_PRODUCTION_EVIDENCE_PACKAGE_MANIFEST
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- end }}
            {{- include "syncratic.renderMapEnv" (dict "root" . "values" .Values.gateway.extraEnv) | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: /syncrauploads
            {{- if or .Values.externalServices.trustBundle.existingConfigMap .Values.externalServices.trustBundle.existingSecret }}
            - name: external-trust-bundle
              mountPath: {{ .Values.externalServices.trustBundle.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.persistence.docs.enabled }}
            - name: docs
              mountPath: {{ .Values.gateway.persistence.docs.mountPath }}
              readOnly: true
            {{- end }}
            {{- if or .Values.gateway.initialOperatorBootstrapSecret.existingSecret .Values.gateway.initialOperatorBootstrapSecret.create }}
            - name: initial-operator-bootstrap
              mountPath: {{ .Values.gateway.initialOperatorBootstrapSecret.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.auth.identityProvisioning.enabled }}
            - name: identity-provisioning-secret
              mountPath: {{ .Values.auth.identityProvisioning.secret.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.gateway.operationsReadiness.enabled .Values.gateway.operationsReadiness.evidenceVolume.enabled .Values.gateway.operationsReadiness.evidenceVolume.existingClaim }}
            - name: operations-readiness-evidence
              mountPath: {{ .Values.gateway.operationsReadiness.evidenceVolume.mountPath }}
              readOnly: {{ .Values.gateway.operationsReadiness.evidenceVolume.readOnly }}
            {{- end }}
            {{- if (default false $networkFileShares.enabled) }}
            {{- range (default list $networkFileShares.mounts) }}
            - name: {{ printf "network-share-%s" .name | trunc 63 | trimSuffix "-" }}
              mountPath: {{ .mountPath | quote }}
              readOnly: {{ default true .readOnly }}
            {{- end }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.gateway.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.gateway.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.gateway.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ default (include "syncratic.gatewayUploadsPvcName" .) .Values.gateway.persistence.uploads.existingClaim }}
        {{- if or .Values.externalServices.trustBundle.existingConfigMap .Values.externalServices.trustBundle.existingSecret }}
        - name: external-trust-bundle
          {{- if .Values.externalServices.trustBundle.existingSecret }}
          secret:
            secretName: {{ include "syncratic.externalTrustBundleSecretName" . }}
          {{- else }}
          configMap:
            name: {{ include "syncratic.externalTrustBundleConfigMapName" . }}
          {{- end }}
        {{- end }}
        {{- if .Values.gateway.persistence.docs.enabled }}
        - name: docs
          persistentVolumeClaim:
            claimName: {{ .Values.gateway.persistence.docs.existingClaim }}
        {{- end }}
        {{- if or .Values.gateway.initialOperatorBootstrapSecret.existingSecret .Values.gateway.initialOperatorBootstrapSecret.create }}
        - name: initial-operator-bootstrap
          secret:
            secretName: {{ include "syncratic.gatewayInitialOperatorBootstrapSecretName" . }}
        {{- end }}
        {{- if .Values.auth.identityProvisioning.enabled }}
        - name: identity-provisioning-secret
          secret:
            secretName: {{ include "syncratic.identityProvisioningSecretName" . }}
        {{- end }}
        {{- if and .Values.gateway.operationsReadiness.enabled .Values.gateway.operationsReadiness.evidenceVolume.enabled .Values.gateway.operationsReadiness.evidenceVolume.existingClaim }}
        - name: operations-readiness-evidence
          persistentVolumeClaim:
            claimName: {{ .Values.gateway.operationsReadiness.evidenceVolume.existingClaim | quote }}
        {{- end }}
        {{- if (default false $networkFileShares.enabled) }}
        {{- range (default list $networkFileShares.mounts) }}
        - name: {{ printf "network-share-%s" .name | trunc 63 | trimSuffix "-" }}
          {{- if .existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim | quote }}
          {{- else if .hostPath }}
          hostPath:
            path: {{ .hostPath.path | quote }}
            {{- with .hostPath.type }}
            type: {{ . | quote }}
            {{- end }}
          {{- else }}
          {{- fail "gateway.networkFileShares.mounts entries require existingClaim or hostPath" }}
          {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
