{{- if .Values.help.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncratic.fullname" . }}-help
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.help.service.type }}
  selector:
    {{- include "syncratic.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: help
  ports:
    - name: http
      port: {{ .Values.help.service.port }}
      targetPort: http
{{- end }}
