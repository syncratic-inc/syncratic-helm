{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syncratic.fullname" . }}-default-deny-ingress
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syncratic.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syncratic.fullname" . }}-shared-egress
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syncratic.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.allowAllEgress }}
    - {}
    {{- else }}
    {{- if .Values.networkPolicy.allowChartPodEgress }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "syncratic.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- if .Values.networkPolicy.dns.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.externalCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- if .Values.gateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syncratic.fullname" . }}-gateway-ingress
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syncratic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "syncratic.selectorLabels" . | nindent 14 }}
        {{- if or .Values.networkPolicy.ingressController.enabled .Values.networkPolicy.allowIngressNamespaceLabels }}
        - {{- if .Values.networkPolicy.ingressController.namespaceLabels }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceLabels | nindent 14 }}
          {{- if .Values.networkPolicy.ingressController.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
          {{- end }}
          {{- else if .Values.networkPolicy.allowIngressNamespaceLabels }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowIngressNamespaceLabels | nindent 14 }}
          {{- else }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
          {{- end }}
        {{- end }}
{{- end }}
