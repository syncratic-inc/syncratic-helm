{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncratic.fullname" . }}-postgres-init
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
data:
  00-create-compatibility-roles.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'syncratic_app') THEN
        CREATE ROLE syncratic_app NOLOGIN;
      END IF;
    END
    $$;
{{- end }}
