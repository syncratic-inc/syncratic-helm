{{ .Values.licensing.renewal.runtimeOutputSecret.enrollmentReceiptJson | nindent 4 }}
  {{ .Values.licensing.renewal.runtimeOutputSecret.keys.machinePrivateKeyPem }}: |
{{ .Values.licensing.renewal.runtimeOutputSecret.machinePrivateKeyPem | nindent 4 }}
  {{ .Values.licensing.renewal.runtimeOutputSecret.keys.mtlsStateJson }}: |
