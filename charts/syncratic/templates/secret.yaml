{{- if and .Values.security.bootstrapSecret.create (not .Values.security.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncratic.bootstrapSecretName" . }}
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENTITLEMENT_SERVICE_TOKEN: {{ .Values.security.bootstrapSecret.entitlementServiceToken | quote }}
  {{- if and (not .Values.auth.runtimeSecret.existingSecret) (not .Values.auth.runtimeSecret.create) }}
  NEXTAUTH_SECRET: {{ .Values.security.bootstrapSecret.nextAuthSecret | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.security.bootstrapSecret.keycloakClientSecret | quote }}
  {{- end }}
  CONNECTOR_TOKEN_ENCRYPTION_KEY: {{ .Values.security.bootstrapSecret.connectorTokenEncryptionKey | quote }}
  NEO4J_PASSWORD: {{ .Values.security.bootstrapSecret.neo4jPassword | quote }}
{{- end }}
{{- if and .Values.auth.runtimeSecret.create (not .Values.auth.runtimeSecret.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncratic.authRuntimeSecretName" . }}
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.runtimeSecret.keys.nextAuthSecret }}: {{ .Values.auth.runtimeSecret.nextAuthSecret | quote }}
  {{ .Values.auth.runtimeSecret.keys.keycloakClientSecret }}: {{ .Values.auth.runtimeSecret.keycloakClientSecret | quote }}
{{- end }}
{{- if and .Values.auth.identityProvisioning.enabled .Values.auth.identityProvisioning.secret.create (not .Values.auth.identityProvisioning.secret.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncratic.identityProvisioningSecretName" . }}
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.identityProvisioning.secret.keys.adminClientSecret }}: {{ .Values.auth.identityProvisioning.secret.adminClientSecret | quote }}
{{- end }}
{{- if and .Values.auth.bootstrapSmtp.enabled .Values.auth.bootstrapSmtp.passwordSecret.create (not .Values.auth.bootstrapSmtp.passwordSecret.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncratic.bootstrapSmtpSecretName" . }}
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.bootstrapSmtp.passwordSecret.key }}: {{ .Values.auth.bootstrapSmtp.passwordSecret.password | quote }}
{{- end }}
