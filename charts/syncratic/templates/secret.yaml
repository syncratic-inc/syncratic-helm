{{- if and .Values.postgres.enabled .Values.postgres.auth.create (not .Values.postgres.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncratic.postgresAuthSecretName" . }}
  labels:
    {{- include "syncratic.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.keys.adminPassword }}: {{ .Values.postgres.auth.password | quote }}
  {{ .Values.postgres.auth.keys.applicationDsn }}: {{ include "syncratic.postgresUrl" . | quote }}
  {{ .Values.postgres.auth.keys.evaluationDsn }}: {{ include "syncratic.postgresUrl" . | quote }}
  {{ .Values.postgres.auth.keys.gatewayMigrationDsn }}: {{ include "syncratic.postgresMigrationDsn" . | quote }}
{{- end }}
