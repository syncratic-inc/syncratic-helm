    failureThreshold: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /realms/{{ .Values.externalServices.keycloakRealm }}
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /realms/{{ .Values.externalServices.keycloakRealm }}
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15

bgeEmbeddings:
