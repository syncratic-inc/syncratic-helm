gateway:
  enabled: true
  exposeLegacyLlmfs: false
  replicaCount: 1
  migrationHook:
    enabled: true
    backoffLimit: 1
    deletePolicy: before-hook-creation,hook-succeeded
  initialOperatorBootstrapSecret:
    existingSecret: ""
    create: false
    mountPath: /run/secrets/initial-operator-bootstrap
    keys:
      bootstrapArtifact: les-initial-operator-bootstrap.json
    bootstrapArtifactJson: ""
  image:
    repository: syncratic/gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podAnnotations: {}
  networkFileShares:
    enabled: false
    # Comma-separated allow-list passed to the gateway as LLMFS_NETWORK_SHARE_ALLOWED_ROOTS.
    # Keep this restricted to deployment-owned mount prefixes that are exposed below.
    allowedRoots: "/mnt/syncratic-shares"
    # Deployment-owned mounted shares. Syncratic does not mount NFS/SMB/CIFS itself;
    # these volumes must reference existing PVCs or host paths prepared by the platform operator.
    mounts: []
    # Example:
    # mounts:
    #   - name: contracts-share
    #     mountPath: /mnt/syncratic-shares/contracts
    #     readOnly: true
    #     existingClaim: contracts-share-pvc
    #   - name: procurement-share
    #     mountPath: /mnt/syncratic-shares/procurement
    #     readOnly: true
    #     hostPath:
    #       path: /mnt/customer-procurement-share
    #       type: Directory
  notifications:
    dispatcher:
      enabled: false
      batchSize: 20
      intervalSeconds: 15
      maxAttempts: 5
      retryBaseSeconds: 60
    webhook:
      enabled: false
      url: ""
      timeoutSeconds: 5
      tokenSecret:
        existingSecret: ""
        create: false
        key: NOTIFICATION_WEBHOOK_TOKEN
        token: ""
  extraEnv:
    AUTH_SESSION_TTL_SECONDS: "300"
    # Model IDs are Admin-owned through runtime model bindings. Leave these blank
    # unless intentionally running in non-DB fallback mode.
    LLM_MODEL: ""
    LLMFS_REDIS_WORKER_LEASE_S: "300"
    LLMFS_REDIS_WORKER_MAX_ATTEMPTS: "3"
    LLMFS_ENABLE_REDIS_ENRICHMENT_QUEUE: "true"
    LLMFS_ENABLE_REDIS_GRAPH_QUEUE: "true"
    LLMFS_ENABLE_REDIS_KNOWLEDGE_QUEUE: "true"
    LLMFS_ENABLE_REDIS_DELTA_QUEUE: "true"
    LLMFS_ENABLE_REDIS_ASSURANCE_CRITERIA_QUEUE: "true"
    LLMFS_ENABLE_KEE_RETRIEVAL_INFLUENCE: "true"
    LLMFS_RUN_ENRICHMENT_WORKER: "false"
    LLMFS_RUN_GRAPH_WORKER: "false"
    LLMFS_RUN_KNOWLEDGE_WORKER: "false"
    LLMFS_RUN_DELTA_WORKER: "false"
    LLMFS_RUN_ASSURANCE_CRITERIA_WORKER: "false"
    LLMFS_ENABLE_GRAPH_ENRICHMENT: "true"
    LLMFS_ENABLE_GRAPH_RETRIEVAL: "true"
    LLMFS_ENABLE_GRAPH_CITATIONS: "false"
    LLMFS_ENABLE_SLM_GRAPH_DECOMPOSITION: "true"
    LLMFS_GRAPH_EXTRACTION_MODEL: ""
    LLMFS_GRAPH_DECOMPOSITION_MAX_WINDOWS: "12"
