      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podAnnotations: {}
  extraEnv:
    TRANSFORMER_ENABLE_PPTX: "true"
    TRANSFORMER_ENABLE_PDF: "true"
    TRANSFORMER_ENABLE_XLSX: "true"
    TRANSFORMER_ENABLE_DOCX: "true"
    PDF_FALLBACK_ENABLE_PDFTOTEXT: "true"
    PDF_FALLBACK_ENABLE_TESSERACT: "true"
    PDF_FALLBACK_OCR_MAX_PAGES: "8"
    PDF_OCR_MIN_CHARS_PER_PAGE: "40"
    PDF_OCR_MIN_TEXT_COVERAGE: "0.70"
    PDF_OCR_FORCE_ON_LOW_TEXT: "true"
  startupProbe:
    httpGet:
      path: /health
      port: http
    failureThreshold: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
