    username: "admin"
    password: ""
  database:
    existingSecret: ""
    create: false
    keys:
      username: KC_DB_USERNAME
      password: KC_DB_PASSWORD
    username: "keycloak"
    password: ""
    image:
      repository: postgres
      tag: "16"
      pullPolicy: IfNotPresent
