global:
  nameOverride: ""
  fullnameOverride: ""
  deploymentId: "syncratic-dev"
  deliveryMode: "bootstrap"
  firstPartyImageRegistry: ""
  imagePullSecrets: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  maxBodySize: "100m"
  tls: []
  publicScheme: "https"
  frontendHost: ""
  gatewayHost: ""
  authHost: ""
  tlsPolicy:
    mode: flexible
    requireTls: false
    requireIngressClass: false
    requireHostsCovered: false
    certManager:
      enabled: false
      clusterIssuer: ""
      issuer: ""

auth:
  frontendClientId: "syncratic-portal"
  exposureMode: "gatewayFacade"
  publicPath: "/auth"
  gatewayBootstrapPath: "/auth/bootstrap"
  connectorOAuthRedirectPath: "/connectors/callback"
  saml:
    enabled: false
    # SAML provider metadata and group mappings are tenant-managed from Admin -> Identity.
    # Enabling this flag declares that the deployment supports SAML group browsing/validation
    # and requires Keycloak admin provisioning credentials for the gateway.
    groupDiscoveryMode: keycloak_groups
  identityProvisioning:
    enabled: false
    initialOperatorEnabled: false
    provider: keycloak
    adminRealm: ""
    adminClientId: "syncratic-user-admin"
    sendRequiredActionEmails: true
    defaultRequiredActions: "VERIFY_EMAIL,UPDATE_PASSWORD"
    secret:
      existingSecret: ""
      create: false
      mountPath: /run/secrets/keycloak-provisioning
      keys:
        adminClientSecret: KEYCLOAK_ADMIN_CLIENT_SECRET
      adminClientSecret: ""
  bootstrapSmtp:
    enabled: false
    host: "smtp-relay.brevo.com"
    port: 587
    username: "9f1a6c001@smtp-brevo.com"
    useStarttls: true
    useSsl: false
    fromEmail: "neoreply@syncratic.co"
    fromName: "Noreply Syncratic"
    replyTo: ""
    syncKeycloak: true
    passwordSecret:
      existingSecret: ""
      create: false
      key: SMTP_PASSWORD
      password: ""
  runtimeSecret:
    existingSecret: ""
    create: false
    keys:
      nextAuthSecret: NEXTAUTH_SECRET
      keycloakClientSecret: KEYCLOAK_CLIENT_SECRET
    nextAuthSecret: ""
    keycloakClientSecret: ""

observability:
  enabled: false
  path: "/observability"
  grafana:
    replicaCount: 1
    image:
      repository: grafana/grafana
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 3000
    adminSecret:
      existingSecret: ""
      create: false
      keys:
        username: GF_SECURITY_ADMIN_USER
        password: GF_SECURITY_ADMIN_PASSWORD
      username: "admin"
      password: ""
    oauth:
      clientId: "grafana-observability"
      scopes: "openid email profile roles"
      allowSignUp: true
      autoLogin: true
      roleAttributePath: "contains(roles[*], 'super_admin') && 'Admin' || contains(roles[*], 'syncratic-admin') && 'Admin' || 'None'"
    datasources:
      prometheus:
        enabled: false
        url: ""
        isDefault: true
      loki:
        enabled: false
        url: ""
    dashboards:
      providerEnabled: true
      bundledEnabled: false
      configMaps: []
    persistence:
      enabled: false
      existingClaim: ""
      size: 5Gi
      storageClassName: ""
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    podAnnotations: {}
    startupProbe:
      httpGet:
        path: /api/health
        port: http
      failureThreshold: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 15

modelBindings:
  bootstrapSync: false
  dbOnly: true

networkPolicy:
  enabled: true
  allowIngressNamespaceLabels: {}
  allowAllEgress: true
  allowChartPodEgress: true
  ingressController:
    enabled: false
    namespaceLabels: {}
    podLabels: {}
  dns:
    enabled: true
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    podLabels:
      k8s-app: kube-dns
  externalCidrs: []
  extraEgressRules: []

materialPolicy:
  sourceMode: flexible
  manager: bootstrap
  publishContract: true
  externalSecrets:
    enabled: false
    apiVersion: external-secrets.io/v1beta1
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    target:
      creationPolicy: Owner
      deletionPolicy: Retain
    remoteKeyPrefix: syncratic
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  requireExternalConnectionSecret: false
  requireExternalTrustBundle: false
  requireConnectedControlPlaneMtls: false

dependencyTests:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  tcpTargets:
    postgres:
      enabled: true
      url: "{{ ternary (printf \"postgresql://%s:%v/%s\" (include \"syncratic.postgresHost\" .) .Values.postgres.service.port .Values.postgres.contract.applicationDatabase) .Values.externalServices.postgresUrl .Values.postgres.enabled }}"
      host: ""
      port: 5432
    redis:
      enabled: true
      url: "{{ ternary (printf \"redis://%s-redis:%v/0\" (include \"syncratic.fullname\" .) .Values.redis.service.port) .Values.externalServices.redisUrl .Values.redis.enabled }}"
      host: ""
      port: 6379
    qdrant:
      enabled: true
      url: "{{ ternary (printf \"http://%s-qdrant:%v\" (include \"syncratic.fullname\" .) .Values.qdrant.service.port) .Values.externalServices.qdrantUrl .Values.qdrant.enabled }}"
      host: ""
      port: 6333
    neo4j:
      enabled: true
      url: "{{ ternary (printf \"bolt://%s-neo4j:%v\" (include \"syncratic.fullname\" .) .Values.neo4j.service.boltPort) .Values.externalServices.neo4jUri .Values.neo4j.enabled }}"
      host: ""
      port: 7687
    keycloak:
      enabled: true
      url: "{{ ternary (include \"syncratic.keycloakInternalUrl\" .) .Values.externalServices.keycloakInternalUrl .Values.keycloak.enabled }}"
      host: ""
      port: 8080
    bgeEmbeddings:
      enabled: true
      url: "{{ ternary (include \"syncratic.bgeEmbeddingsUrl\" .) .Values.externalServices.bgeEmbeddingsUrl .Values.bgeEmbeddings.enabled }}"
      host: ""
      port: 8000
    llmFast:
      # Runtime model endpoints are Admin-owned by default; enable this probe
      # only when a packaged or explicit external fast model endpoint is present.
      enabled: false
      url: "{{ ternary (include \"syncratic.llmFastUrl\" .) .Values.externalServices.llmFastUrl .Values.llmFast.enabled }}"
      host: ""
      port: 8000
    llmDeep:
      # Runtime model endpoints are Admin-owned by default; enable this probe
      # only when a packaged or explicit external deep model endpoint is present.
      enabled: false
      url: "{{ ternary (include \"syncratic.llmDeepUrl\" .) .Values.externalServices.llmDeepUrl .Values.llmDeep.enabled }}"
      host: ""
      port: 8000
    transformer:
      enabled: true
      url: "{{ ternary (printf \"http://%s-transformer:%v\" (include \"syncratic.fullname\" .) .Values.transformer.service.port) .Values.externalServices.transformerUrl .Values.transformer.enabled }}"
      host: ""
      port: 8091

runtimeTests:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  httpTargets:
    gateway:
      enabled: true
      url: "http://{{ include \"syncratic.fullname\" . }}-gateway:{{ .Values.gateway.service.port }}/gateway/ready"
    systemApiHealth:
      enabled: true
      url: "http://{{ include \"syncratic.fullname\" . }}-gateway:{{ .Values.gateway.service.port }}/api/v1/system/health"
    frontend:
      enabled: true
      url: "http://{{ include \"syncratic.fullname\" . }}-frontend:{{ .Values.frontend.service.port }}/"
    help:
      enabled: "{{ .Values.help.enabled }}"
      url: "http://{{ include \"syncratic.fullname\" . }}-help:{{ .Values.help.service.port }}/health"
    helpCurator:
      enabled: "{{ and .Values.help.enabled .Values.help.curator.enabled }}"
      url: "http://{{ include \"syncratic.fullname\" . }}-help-curator:{{ .Values.help.curator.service.port }}/health"
    licensing:
      enabled: true
      url: "http://{{ include \"syncratic.fullname\" . }}-licensing:{{ .Values.licensing.service.port }}/ready"
    registration:
      enabled: "{{ .Values.registration.enabled }}"
      url: "http://{{ include \"syncratic.fullname\" . }}-registration:{{ .Values.registration.service.port }}/ready"
    keycloak:
      enabled: "{{ .Values.keycloak.enabled }}"
      url: "{{ include \"syncratic.internalKeycloakIssuerUrl\" . }}/.well-known/openid-configuration"
    observabilityGrafana:
      enabled: "{{ .Values.observability.enabled }}"
      url: "http://{{ include \"syncratic.observabilityGrafanaName\" . }}:{{ .Values.observability.grafana.service.port }}/api/health"
    evaluation:
      enabled: "{{ .Values.evaluation.enabled }}"
      url: "http://{{ include \"syncratic.fullname\" . }}-evaluation-agent:{{ .Values.evaluation.service.port }}/eval/health"
    bgeEmbeddings:
      enabled: "{{ .Values.bgeEmbeddings.enabled }}"
      url: "{{ include \"syncratic.bgeEmbeddingsUrl\" . }}/health"
    llmFast:
      enabled: "{{ .Values.llmFast.enabled }}"
      url: "{{ include \"syncratic.llmFastUrl\" . }}/health"
    llmDeep:
      enabled: "{{ .Values.llmDeep.enabled }}"
      url: "{{ include \"syncratic.llmDeepUrl\" . }}/health"
    transformer:
      enabled: true
      url: "{{ ternary (printf \"http://%s-transformer:%v/health\" (include \"syncratic.fullname\" .) .Values.transformer.service.port) \"\" .Values.transformer.enabled }}"
  tcpTargets:

materialTests:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  bootstrapRequiredSecretKeys:
    - ENTITLEMENT_SERVICE_TOKEN
    - CONNECTOR_TOKEN_ENCRYPTION_KEY
    - NEO4J_PASSWORD
  authRequiredSecretKeys:
    - NEXTAUTH_SECRET
    - KEYCLOAK_CLIENT_SECRET
  identityProvisioningRequiredSecretKeys:
    - KEYCLOAK_ADMIN_CLIENT_SECRET
  bootstrapSmtpRequiredSecretKeys:
    - SMTP_PASSWORD
  keycloakAdminRequiredSecretKeys:
    - KEYCLOAK_ADMIN
    - KEYCLOAK_ADMIN_PASSWORD
  keycloakDbRequiredSecretKeys:
    - KC_DB_USERNAME
    - KC_DB_PASSWORD
  observabilityGrafanaAdminRequiredSecretKeys:
    - GF_SECURITY_ADMIN_USER
    - GF_SECURITY_ADMIN_PASSWORD
  helpRequiredSecretKeys:
    - HELP_GATEWAY_TOKEN
  helpCuratorRequiredSecretKeys:
    - HELP_CURATOR_GATEWAY_TOKEN
  evaluationRequiredSecretKeys:
    - EVAL_INTERNAL_TRIGGER_TOKEN
    - EVAL_SERVICE_GATEWAY_API_KEY
  postgresRequiredSecretKeys:
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - EVAL_DB_DSN
    - GATEWAY_MIGRATION_DSN
  publicKeyConfig:
    requireNonEmptyKeySet: true
  registrationPublicKeyConfig:
    requireNonEmptyKeySet: true

ingressTests:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

security:
  existingSecret: ""
  bootstrapSecret:
    create: true
    entitlementServiceToken: "syncratic-les-internal-v1"
    nextAuthSecret: ""
    keycloakClientSecret: ""
    connectorTokenEncryptionKey: ""
    neo4jPassword: "syncratic-neo4j-v1"

externalServices:
  connectionSecret:
    existingSecret: ""
    keys:
      postgresUrl: DATABASE_URL
      gatewayMigrationDsn: GATEWAY_MIGRATION_DSN
      redisUrl: REDIS_URL
      qdrantUrl: QDRANT_URL
      neo4jUri: NEO4J_URI
      neo4jUsername: NEO4J_USERNAME
      neo4jPassword: NEO4J_PASSWORD
      keycloakInternalUrl: KEYCLOAK_INTERNAL_URL
      bgeEmbeddingsUrl: BGE_EMBEDDINGS_URL
      llmFastUrl: LLM_FAST_URL
      llmDeepUrl: LLM_DEEP_URL
      transformerUrl: TRANSFORMER_URL
  trustBundle:
    existingConfigMap: ""
    existingSecret: ""
    key: ca.crt
    mountPath: /etc/syncratic/external-trust
  postgresUrl: "postgresql+psycopg://postgres:postgres@rag-pg:5432/syncratic_rag"
  gatewayMigrationDsn: "postgresql://postgres:postgres@rag-pg:5432/syncratic_rag"
  redisUrl: "redis://redis:6379/0"
  qdrantUrl: "http://qdrant:6333"
  neo4jUri: "bolt://neo4j:7687"
  keycloakInternalUrl: "http://keycloak:8080"
  keycloakRealm: "syncratic"
  bgeEmbeddingsUrl: "http://bge-emb:8000"
  # Runtime model endpoints are normally configured through Admin -> Models.
  # Set these only for external endpoint bootstrap, chart dependency tests, or
  # deployments that intentionally keep model bindings outside the database.
  llmFastUrl: ""
  llmDeepUrl: ""
  transformerUrl: "http://artifact-transformer:8091"
  # Tenant-specific connector OAuth credentials should be configured at runtime
  # through the product admin surface. Keep environment-level connector provider
  # credentials as optional platform fallback only.

